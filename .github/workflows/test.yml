name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Go Tests
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 10

    env:
      REDIS_ADDR: localhost:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.3'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Verify Chrome installation
        run: chrome --version || chromium-browser --version || google-chrome --version

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests
        run: go test ./... -short -v

      - name: Run integration tests
        run: go test ./integration/... -v -timeout 10m

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.3'
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.3'
          cache: true

      - name: Build CLI
        run: go build -v -o juango .

      - name: Test CLI runs
        run: ./juango version

  smoke:
    name: Containerized Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run smoke test (scaffold -> build -> serve -> worker, with Redis)
        run: docker compose -f docker-compose.smoke.yml up --build --exit-code-from runner

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.smoke.yml down -v
